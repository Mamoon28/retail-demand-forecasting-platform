name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn statsmodels pytest ruff

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest -q
